[project]
name = "vox"
# La version est lue dans src/vox/__init__.py (source de verite unique).
dynamic = ["version"]
description = "Dictee vocale globale : transcription Whisper + reformulation LLM via OpenRouter"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.6.0",
    "keyboard>=0.13.5; sys_platform == 'win32'",
    "numpy>=2.5.3",
    "pyside6>=6.11.2",
    "pynput>=1.7.7; sys_platform == 'linux'",
    "sounddevice>=0.5.6",
    # Son du systeme (WASAPI loopback) et applications qui jouent du son.
    "pycaw>=20240210; sys_platform == 'win32'",
    "pyaudiowpatch>=0.2.12.8; sys_platform == 'win32'",
]

[project.scripts]
vox = "vox.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/vox/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vox"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM", "RUF", "S", "DTZ", "LOG", "UP", "PYI"]
# Les libelles francais utilisent legitimement des caracteres "ambigus"
# (× pour la multiplication, ’ comme apostrophe).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Application de bureau mono-utilisateur : la date locale naive est voulue.
"src/vox/stats.py" = ["DTZ011"]
"src/vox/updates.py" = ["DTZ011"]
# Les chemins de nettoyage (fermeture de flux, sons, presse-papier) doivent
# rester silencieux : une erreur n'y a aucune valeur pour l'utilisateur.
"src/vox/sounds.py" = ["S110"]
"src/vox/recorder.py" = ["S110"]
"src/vox/hotkey.py" = ["S110"]
"src/vox/api.py" = ["S110"]
# La detection des entrees audio est defensive : un peripherique casse ou une
# session COM fermee ne doit jamais remonter d'erreur bruyante.
"src/vox/sources.py" = ["S110", "S112"]
# L'historique est un journal local : l'heure locale naive est volontaire.
"src/vox/pipeline.py" = ["DTZ005"]
"src/vox/recordings.py" = ["DTZ005"]
"src/vox/library.py" = ["DTZ005"]
# Les commandes ffmpeg sont passees en liste d'arguments, sans shell, avec un
# chemin resolu par imageio-ffmpeg (voir audiofiles.py).
"src/vox/audiofiles.py" = ["S603", "S607"]
# Dans les tests, `assert` est l'outil de verification normal.
"tests/*.py" = ["S101"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8.0",
]
