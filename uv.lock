    { name = "httpx" },
    { name = "imageio-ffmpeg" },
    { name = "keyboard", marker = "sys_platform == 'win32'" },
    { name = "numpy" },
    { name = "pyaudiowpatch", marker = "sys_platform == 'win32'" },
    { name = "pycaw", marker = "sys_platform == 'win32'" },
    { name = "pynput", marker = "sys_platform == 'linux'" },
    { name = "pyside6" },
    { name = "sounddevice" },
]

[package.dev-dependencies]
dev = [
    { name = "pyinstaller" },
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "httpx", specifier = ">=0.28.1" },
    { name = "imageio-ffmpeg", specifier = ">=0.6.0" },
    { name = "keyboard", marker = "sys_platform == 'win32'", specifier = ">=0.13.5" },
    { name = "numpy", specifier = ">=2.5.3" },
    { name = "pyaudiowpatch", marker = "sys_platform == 'win32'", specifier = ">=0.2.12.8" },
    { name = "pycaw", marker = "sys_platform == 'win32'", specifier = ">=20240210" },
    { name = "pynput", marker = "sys_platform == 'linux'", specifier = ">=1.7.7" },
    { name = "pyside6", specifier = ">=6.11.2" },
    { name = "sounddevice", specifier = ">=0.5.6" },
]

[package.metadata.requires-dev]
dev = [
    { name = "pyinstaller", specifier = ">=6.22.3" },
    { name = "pytest", specifier = ">=8.0" },
]
