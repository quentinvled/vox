[project]
name = "vox-relay"
dynamic = ["version"]
description = "Relais Vox : dictée depuis le téléphone vers l'ordinateur (vox.vled.fr)"
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.14.5,<4"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-aiohttp>=1.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "vox_relay/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["vox_relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]
